<!doctype html>
<html>
  <head><base target="_top"></head>
  <body>
    <script>
      (function () {
        const allowed = new Set(['https://uaimattoso.github.io', 'http://127.0.0.1:5173', 'http://localhost:5173']);
        const nonce = <?!= JSON.stringify(nonce) ?>;
        const announce = function () {
          window.top.postMessage({ source: 'fluxo-ca-bridge', type: 'ready', nonce: nonce }, '*');
        };
        announce();
        const readyTimer = window.setInterval(announce, 1000);
        window.addEventListener('message', function (event) {
          if (!allowed.has(event.origin) || event.source !== window.top) return;
          const request = event.data;
          if (!request || request.source !== 'fluxo-ca-site' || request.nonce !== nonce || typeof request.id !== 'string') return;
          window.clearInterval(readyTimer);
          google.script.run
            .withSuccessHandler(function (result) {
              event.source.postMessage({ source: 'fluxo-ca-bridge', type: 'result', nonce: nonce, id: request.id, result: result }, event.origin);
            })
            .withFailureHandler(function (error) {
              event.source.postMessage({ source: 'fluxo-ca-bridge', type: 'result', nonce: nonce, id: request.id, error: String(error && error.message || error) }, event.origin);
            })
            .bridgeRequest({ action: request.action, body: request.body, accessKey: request.accessKey });
        });
      }());
    </script>
  </body>
</html>
